name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'codex/flue-v2-*'

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      !startsWith(github.head_ref, 'codex/flue-v2-') ||
      github.head_ref == 'codex/flue-v2-00-stack-ci' ||
      github.head_ref == 'codex/flue-v2-08-production-verification'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.10.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Coding Worker shell sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          /usr/bin/bwrap --ro-bind / / --unshare-all --share-net -- /bin/true

      - name: Create CI runtime configuration
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUN_POD_API_KEY }}
        run: |
          test -n "$OLLAMA_API_KEY"
          test -n "$RUNPOD_API_KEY"
          {
            printf 'OLLAMA_API_KEY=%s\n' "$OLLAMA_API_KEY"
            printf 'RUNPOD_API_KEY=%s\n' "$RUNPOD_API_KEY"
          } > sim-one.config
          chmod 600 sim-one.config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM artifact
        run: pnpm run wasm:build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Fetch embedding model
        run: pnpm run fetch-embedding-model

      - name: Unit tests
        run: pnpm run test:unit
        env:
          GOROMBO_TEST_MODE: '1'

      - name: Rust crate tests
        run: pnpm run cargo:test

      - name: Build
        run: pnpm run build

      - name: Build Ratatui TUI
        run: pnpm run build:tui:ratatui

      - name: Build CLI
        run: pnpm run build:cli

      - name: Ratatui TUI product smoke
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm run test:tui:ratatui
        env:
          GOROMBO_TEST_MODE: '1'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUN_POD_API_KEY }}
          SIM_ONE_TEST_MODEL_CARD: kimi-k2-6-runpod

      - name: Verify CLI binary
        run: test -f .gorombo/sim-one-cli/cli.js

      - name: Integration tests
        run: pnpm run test:http
        env:
          GOROMBO_TEST_MODE: '1'

      - name: TUI end-to-end test
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm run test:tui
        env:
          GOROMBO_TEST_MODE: '1'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUN_POD_API_KEY }}
          SIM_ONE_TEST_MODEL_CARD: kimi-k2-6-runpod

      - name: Verify WASM artifact in build output
        run: test -f .gorombo/sim-one-alpha/memory/gorombo_memory_bg.wasm

  flue-v2-stack-slice:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'codex/flue-v2-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.10.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test stack-slice validator
        run: node --test scripts/check-flue-v2-stack-slice.test.mjs

      - name: Validate stack boundary
        env:
          STACK_BASE_REF: ${{ github.base_ref }}
          STACK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_HEAD_REF: ${{ github.head_ref }}
          STACK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-flue-v2-stack-slice.mjs

      - name: Verify documentation
        run: pnpm run docs:check

      - name: Typecheck compiler-coherent slices
        if: >-
          github.head_ref == 'codex/flue-v2-04-execution-persistence' ||
          github.head_ref == 'codex/flue-v2-05-connectors-clients' ||
          github.head_ref == 'codex/flue-v2-06-product-packaging' ||
          github.head_ref == 'codex/flue-v2-07-documentation' ||
          github.head_ref == 'codex/flue-v2-08-production-verification'
        run: pnpm run typecheck
